<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation: Phantom Thread</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="crt-overlay"></div>
    <div class="container">
        <header>
            <div class="logo">
                <span class="icon">👁️</span>
                <h1>Campus Intelligence Division</h1>
            </div>
            <div class="status-bar">
                <span class="status-indicator"></span>
                <span class="status-text">SECURE CONNECTION ESTABLISHED</span>
            </div>
        </header>

        <main id="terminal">
            <div id="output"></div>
            <div class="input-line">
                <span class="prompt-symbol">&gt;</span>
                <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
